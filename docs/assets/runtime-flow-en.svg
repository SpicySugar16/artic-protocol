<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="colBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="actBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#777777"/>
    </marker>
    <marker id="arrL" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M7,0 L0,2.5 L7,5" fill="#888888"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="355" rx="14" fill="#0d0d0d"/>

  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="2">Runtime Message Flow</text>
  <line x1="260" y1="44" x2="540" y2="44" stroke="#333333" stroke-width="1"/>

  <!-- 三列：A(0-260)  Engine(260-540)  B(540-800) -->
  <text x="130" y="74" text-anchor="middle" fill="#cccccc" font-size="13" font-weight="600">Module A</text>
  <text x="400" y="74" text-anchor="middle" fill="#cccccc" font-size="13" font-weight="600">Engine</text>
  <text x="670" y="74" text-anchor="middle" fill="#cccccc" font-size="13" font-weight="600">Module B</text>

  <line x1="260" y1="62" x2="260" y2="310" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="540" y1="62" x2="540" y2="310" stroke="#2a2a2a" stroke-width="1"/>

  <!-- === Step 1: call === -->
  <rect x="40" y="90" width="180" height="28" rx="6" fill="url(#actBg)" stroke="#555555" stroke-width="1" filter="url(#sh)"/>
  <text x="130" y="108" text-anchor="middle" fill="#e0e0e0" font-size="11">call("foo.bar", ...)</text>

  <line x1="220" y1="104" x2="280" y2="104" stroke="#777777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- === Step 2: look up registry === -->
  <rect x="280" y="90" width="240" height="28" rx="6" fill="url(#colBg)" stroke="#666666" stroke-width="1" filter="url(#sh)"/>
  <text x="400" y="108" text-anchor="middle" fill="#cccccc" font-size="11">Look up service registry</text>

  <line x1="520" y1="104" x2="580" y2="104" stroke="#777777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- === Step 3: on_message === -->
  <rect x="580" y="90" width="180" height="28" rx="6" fill="url(#actBg)" stroke="#555555" stroke-width="1" filter="url(#sh)"/>
  <text x="670" y="108" text-anchor="middle" fill="#e0e0e0" font-size="11">on_message(Request)</text>

  <!-- Step numbers 1-3 -->
  <circle cx="28" cy="98" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="28" y="102" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">1</text>
  <circle cx="268" cy="98" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="268" y="102" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">2</text>
  <circle cx="558" cy="98" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="558" y="102" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">3</text>

  <!-- === Step 4: B processes === -->
  <line x1="670" y1="118" x2="670" y2="140" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="580" y="143" width="180" height="36" rx="6" fill="url(#actBg)" stroke="#555555" stroke-width="1" stroke-dasharray="4,2" filter="url(#sh)"/>
  <text x="670" y="166" text-anchor="middle" fill="#999999" font-size="11">Process request</text>

  <circle cx="558" cy="155" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="558" y="159" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">4</text>

  <!-- === Step 5: B → Engine response === -->
  <line x1="580" y1="179" x2="580" y2="210" stroke="#555555" stroke-width="1.5"/>
  <line x1="580" y1="210" x2="520" y2="210" stroke="#888888" stroke-width="1.5" marker-end="url(#arrL)"/>

  <!-- === Step 6: Engine routes response === -->
  <rect x="280" y="195" width="240" height="28" rx="6" fill="url(#colBg)" stroke="#666666" stroke-width="1" filter="url(#sh)"/>
  <text x="400" y="213" text-anchor="middle" fill="#cccccc" font-size="11">Route response back to caller</text>

  <circle cx="268" cy="210" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="268" y="214" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">5</text>

  <!-- === Step 7: Engine → A response === -->
  <line x1="280" y1="210" x2="220" y2="210" stroke="#888888" stroke-width="1.5" marker-end="url(#arrL)"/>

  <rect x="40" y="195" width="180" height="28" rx="6" fill="url(#actBg)" stroke="#555555" stroke-width="1" filter="url(#sh)"/>
  <text x="130" y="213" text-anchor="middle" fill="#e0e0e0" font-size="11">Receive response</text>

  <circle cx="28" cy="210" r="8" fill="#3a3a3a" stroke="#666666" stroke-width="1"/>
  <text x="28" y="214" text-anchor="middle" fill="#cccccc" font-size="9" font-weight="600">6</text>

  <!-- Legend -->
  <line x1="60" y1="325" x2="95" y2="325" stroke="#777777" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="103" y="329" fill="#666666" font-size="10">Request</text>
  <line x1="160" y1="325" x2="195" y2="325" stroke="#888888" stroke-width="1.5" marker-end="url(#arrL)"/>
  <text x="203" y="329" fill="#666666" font-size="10">Response</text>
</svg>
